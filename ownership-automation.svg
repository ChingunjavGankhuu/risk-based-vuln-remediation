<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="720" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">AI-Assisted Vulnerability-to-Owner Mapping Automation</text>
  <text x="450" y="62" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">Reference architecture for connecting each vulnerability to the team accountable for remediation</text>

  <!-- ===== INPUTS ===== -->
  <text x="450" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Inputs — generalized information sources</text>

  <rect x="60" y="112" width="180" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="150" y="134" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">Code repositories</text>
  <text x="150" y="150" text-anchor="middle" font-size="9" fill="#64748b">ownership signals in code</text>

  <rect x="260" y="112" width="180" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="350" y="134" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">Service &amp; ownership</text>
  <text x="350" y="150" text-anchor="middle" font-size="9" fill="#64748b">directories / inventories</text>

  <rect x="460" y="112" width="180" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="550" y="134" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">Team &amp; personnel</text>
  <text x="550" y="150" text-anchor="middle" font-size="9" fill="#64748b">records</text>

  <rect x="660" y="112" width="180" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="750" y="134" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">Vulnerability-scan</text>
  <text x="750" y="150" text-anchor="middle" font-size="9" fill="#64748b">output</text>

  <line x1="150" y1="162" x2="150" y2="188" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="350" y1="162" x2="350" y2="188" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="550" y1="162" x2="550" y2="188" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="750" y1="162" x2="750" y2="188" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="150" y1="188" x2="750" y2="188" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="450" y1="188" x2="450" y2="200" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="450,208 444,198 456,198" fill="#94a3b8"/>

  <!-- ===== THE AUTOMATION ===== -->
  <rect x="90" y="216" width="720" height="404" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
  <text x="450" y="242" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">Ownership-Mapping Automation</text>
  <text x="450" y="260" text-anchor="middle" font-size="10.5" fill="#78716c" font-style="italic">Workflow and matching logic connecting the sources above to an AI assistant</text>

  <!-- Step: gather/normalize (TOP, centered) -->
  <rect x="300" y="276" width="300" height="44" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.3"/>
  <text x="450" y="296" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">Gather &amp; normalize inputs</text>
  <text x="450" y="311" text-anchor="middle" font-size="9" fill="#475569">reconcile naming across sources</text>

  <!-- down arrow -->
  <line x1="450" y1="320" x2="450" y2="344" stroke="#94a3b8" stroke-width="1.8"/>
  <polygon points="450,352 445,342 455,342" fill="#94a3b8"/>

  <!-- Step: AI matching (BELOW, centered) -->
  <rect x="300" y="354" width="300" height="44" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.3"/>
  <text x="450" y="374" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">AI-assisted matching logic</text>
  <text x="450" y="389" text-anchor="middle" font-size="9" fill="#475569">match vulnerability to responsible team</text>

  <!-- down arrow to tiers -->
  <line x1="450" y1="398" x2="450" y2="420" stroke="#94a3b8" stroke-width="1.8"/>
  <polygon points="450,428 445,418 455,418" fill="#94a3b8"/>

  <!-- Confidence-tiered resolution -->
  <text x="240" y="444" font-size="11" font-weight="bold" fill="#334155">Confidence-tiered resolution (first confident match wins):</text>

  <rect x="150" y="452" width="600" height="30" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="170" y="471" font-size="11" font-weight="bold" fill="#166534">Tier A</text>
  <text x="240" y="471" font-size="10" fill="#334155">Authoritative, hand-confirmed ownership sources  &#8594;  high confidence</text>

  <rect x="150" y="488" width="600" height="30" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="170" y="507" font-size="11" font-weight="bold" fill="#166534">Tier B</text>
  <text x="240" y="507" font-size="10" fill="#334155">Curated inventory and team maps  &#8594;  medium confidence</text>

  <rect x="150" y="524" width="600" height="30" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="170" y="543" font-size="11" font-weight="bold" fill="#92400e">Tier C</text>
  <text x="240" y="543" font-size="10" fill="#334155">AI-assisted inference  &#8594;  lower confidence, flagged for human review</text>

  <rect x="150" y="560" width="600" height="30" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="170" y="579" font-size="11" font-weight="bold" fill="#991b1b">Unknown</text>
  <text x="240" y="579" font-size="10" fill="#334155">No match  &#8594;  flagged for human routing (never guessed)</text>

  <!-- arrow to output -->
  <line x1="450" y1="590" x2="450" y2="612" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="450,620 445,610 455,610" fill="#94a3b8"/>

  <!-- ===== OUTPUT (outside the box, at bottom) ===== -->
  <rect x="270" y="622" width="360" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="450" y="645" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Vulnerability matched to accountable owner</text>
  <text x="450" y="662" text-anchor="middle" font-size="9.5" fill="#475569">replaces a manual, multi-step ownership lookup with a repeatable process</text>

  <!-- footer -->
  <text x="450" y="700" text-anchor="middle" font-size="10" fill="#94a3b8" font-style="italic">This design covers the workflow, matching logic, and source integrations. The AI model is a third-party assistant.</text>
  <text x="450" y="714" text-anchor="middle" font-size="10" fill="#94a3b8" font-style="italic">Adapt the sources and confidence tiers to your own environment.</text>
</svg>
